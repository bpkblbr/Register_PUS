<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTER PUS</title>

  <!-- 1. Favicon untuk Tab Browser -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bpkblbr/Register_PUS/refs/heads/main/Logo3.png">

  <!-- 2. Pengaturan khusus Android / PWA -->
  <meta name="theme-color" content="#3182ce">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="R/I/PUS">

  <!-- 3. Ikon khusus iOS (Apple Safari) -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/bpkblbr/Register_PUS/refs/heads/main/Logo3.png">

  <!-- 4. Panggil File Manifest Terpisah -->
  <link rel="manifest" href="manifest.json">

  <!-- Font Awesome untuk Ikon Loading -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    .loading-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #4a5568;
      z-index: 1;
    }

    .loading-icon {
      font-size: 3rem;
      color: #3182ce;
      margin-bottom: 12px;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="loading-container">
    <i class="fa-solid fa-spinner fa-spin loading-icon"></i>
    <p>Memuat aplikasi...</p>
  </div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbzHVGDWHD26cD_KsMicWuCoKYDVWGkbtoK3xqxwLQ8OHF4pJLZ3s-yQcSAYMwyeVlspoA/exec" 
    allow="geolocation; microphone; camera">
  </iframe>

<!-- Tempatkan di index.html Repository GitHub (sebelum </body>) -->
  <script>
    window.addEventListener("message", function(event) {
      if (event.data === "keluar_aplikasi") {
        
        window.close();

        document.body.innerHTML = `
          <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:Arial, sans-serif; text-align:center; background-color:#f4f6f9; padding:20px;">
            <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: #38a169; margin-bottom: 16px;"></i>
            <h2 style="color:#2d3748; margin-bottom:8px;">Anda telah keluar dari aplikasi</h2>
            <p style="color:#718096; font-size:0.95rem;">Terima kasih telah menggunakan REGISTER PUS.<br>Silakan tutup jendela browser ini.</p>
          </div>
        `;
      }
    });
  </script>
  
</body>
</html>
